[project]
name = "mcp-server-senseca-pro"
version = "0.1.1"
description = "Unofficial MCP server for Senseca PRO 111 / PRO 115 Pt100 thermometers"
readme = "README.md"
authors = [
    { name = "shaag7967", email = "shaag@gmx.net" }
]
requires-python = ">=3.10"
license = "MIT"
keywords = ["mcp", "senseca", "pt100", "thermometer", "serial"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware",
]
dependencies = [
    "mcp>=2.3.0",
    "pyserial>=3.5",
]

[project.urls]
Repository = "https://github.com/shaag7967/mcp-server-senseca-pro"
Issues = "https://github.com/shaag7967/mcp-server-senseca-pro/issues"
Changelog = "https://github.com/shaag7967/mcp-server-senseca-pro/releases"

[project.scripts]
mcp-server-senseca-pro = "mcp_server_senseca_pro:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
